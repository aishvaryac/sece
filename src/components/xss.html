<!DOCTYPE html>
<html>
<head>
    <title>Form with Image</title>
</head>
<body>

    <form id="myForm">
    <input type="text" id="username" placeholder="Enter Username" required><br><br>
    <textarea id="message" rows="3" cols="30" placeholder="Enter text..." required></textarea><br><br>
    <input type="url" id="imgUrl" placeholder="Paste Image URL (https://...)"><br><br>
    <button type="submit">Submit</button>
    </form>

    <div id="result"></div>

    <script>
    document.getElementById("myForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const user = document.getElementById("username").value;
        const text = document.getElementById("message").value;
        const imgUrl = document.getElementById("imgUrl").value.trim();
        const resultDiv = document.getElementById("result");

      // Clear previous output
        resultDiv.innerHTML = "";

      // 1. Add text safely
        const p = document.createElement("p");
        p.textContent = user + ": " + text;
        resultDiv.appendChild(p);

      // 2. Add image if URL is provided
        if (imgUrl !== "") {
        const img = document.createElement("img");
        img.src = imgUrl;
        img.width = 200; // Set image width
        img.onerror = function() {
        p.textContent += " (Error: Invalid image link)";
        img.remove();
        };
        resultDiv.appendChild(img);
        }
    });
    </script>

</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</body>
</html>
